##### wpa_supplicant configuration file template — Meizu m681 (MT6755) #####
#
# Minimal MediaTek-combo template. The AOSP wpa_supplicant module in A13 no
# longer ships a `wpa_supplicant.conf` module of its own, so the device tree
# has to provide the file. Kept deliberately minimal: the interface is driven
# by the framework, and MTK private driver commands come from
# lib_driver_cmd_mt66xx (BOARD_WPA_SUPPLICANT_PRIVATE_LIB in BoardConfig.mk).
update_config=1
ctrl_interface=/data/vendor/wifi/wpa/sockets
driver_param=use_p2p_group_interface=1
update_config=1

device_name=Meizu M3 Note
manufacturer=Meizu
model_name=m681
model_number=m681
serial_number=
device_type=10-0050F204-5
config_methods=physical_display virtual_push_button
p2p_no_group_iface=1
